name: Test Generation

on:
  schedule:
    # Weekdays at 06:00 UTC
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: dev1
    timeout-minutes: 120
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate tests from In Progress backlog
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          agent -p --force --trust --output-format text "$(cat <<'EOF'
          Work the In Progress backlog per .cursor/rules/qa-orchestration.mdc Backlog mode.

          Queue: all DS tickets in status "In Progress" that do not have the tests-generated label.
          Cap: at most 5 tickets this run.

          Per ticket: analyze → write a conforming Playwright spec under tests/ → run npx playwright test → triage on red.
          Open one PR per ticket, link the ticket, then add the tests-generated label so the next run skips it.
          On a repeated identical failure, stop that ticket and move on. Never merge or close a ticket.
          EOF
          )"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
