name: Test Generation

on:
  schedule:
    # Weekdays at 06:00 UTC
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: dev1
    timeout-minutes: 120
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate tests from In Progress backlog
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          # Jira Cloud Basic auth = email + API token (MCP OAuth is unavailable in Actions)
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          ATLASSIAN_BASE_URL: ${{ secrets.ATLASSIAN_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$ATLASSIAN_EMAIL" ] || [ -z "$ATLASSIAN_API_TOKEN" ]; then
            echo "::error::Missing ATLASSIAN_EMAIL and/or ATLASSIAN_API_TOKEN in the 'dev1' environment secrets."
            echo "Jira REST Basic auth requires both. Create an API token at https://id.atlassian.com/manage-profile/security/api-tokens"
            exit 1
          fi
          agent -p --force --trust --output-format text "$(cat <<'EOF'
          Work the In Progress backlog per .cursor/rules/qa-orchestration.mdc Backlog mode.

          Auth: use Jira REST with Basic auth (ATLASSIAN_EMAIL + ATLASSIAN_API_TOKEN). Do not use Atlassian MCP — OAuth is unavailable in GitHub Actions. Base URL is ATLASSIAN_BASE_URL (default https://legionqaschool.atlassian.net).

          Queue: all DS tickets in status "In Progress" that do not have the tests-generated label.
          Cap: at most 5 tickets this run.

          Per ticket: analyze → write a conforming Playwright spec under tests/ → run npx playwright test → triage on red.
          Open one PR per ticket, link the ticket, then add the tests-generated label so the next run skips it.
          On a repeated identical failure, stop that ticket and move on. Never merge or close a ticket.

          Before finishing: regenerate eval-report.md per .cursor/skills/eval-report/SKILL.md
          (`npm run eval:report` or `node scripts/generate-eval-report.mjs`). Commit it on
          each ticket PR when you open one; if no PR this run, leave the file updated on
          the working tree for the upload step.
          EOF
          )"

      - name: Regenerate suite reliability eval report
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVAL_E2E_RUNS: '10'
        run: npm run eval:report

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: eval-report
          path: eval-report.md
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
